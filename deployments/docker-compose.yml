version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MASTER_DATABASE_URL=postgres://postgres:password@db:5432/crypto?sslmode=disable
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      # In production, use a strong password and manage it securely (e.g., Kubernetes Secrets, Docker Secrets)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
    ports:
      - "5432:5432"
